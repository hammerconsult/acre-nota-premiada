            ng-click="cancel()">&times;
    </button>

</div>
<div class="modal-body" style="background-color: #F3F3F4">

            <ng-pdf template-url="/app/entities/impressaoPdf/template.html"
                    canvasid="pdf"
                    scale="1.3">
            </ng-pdf>
    </div>
</div>
