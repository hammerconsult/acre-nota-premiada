<style>
    .cropArea {
        background: #E4E4E4;
        overflow: hidden;
        width: 200px;
        height: 175px;
    }
</style>

<form class="form-horizontal p-lg" name="form" role="form" ng-submit="register()">
    <div ng-show="passo == 1">
        <div class="ibox m-t-lg">
            <div class="ibox-title">
                <h4>Dados do Usuário</h4>
            </div>
            <div class="ibox-content">
                <div class="row">
                    <div class="col-md-3">
                        <div class="col-md-12">
                            <div class="cropArea">
                                <img-crop ng-show="myImage" image="myImage" result-image="myCroppedImage"></img-crop>

                                <img alt="image"
                                     ng-src="/assets/images/user-default.jpg"
                                     width="175" height="175" style="margin-left: 12.5px; "/>
                            </div>

                            <label for="file-upload"
                                   class="custom-file-upload">
                                <span class="fa fa-cloud-upload"></span> Carregar Foto
                            </label>
                            <input type="file"
                                   id="file-upload"
                                   name="file"
                                   ngf-select="upload($file)"
                                   ng-model="arquivo"
                                   ngf-max-size="15MB"
                                   accept="image/*">
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div class="form-group">
                            <div class="col-md-3">
                                <label for="field_cpf">CPF <span class="text-danger">*</span></label>
                                <input type="text"
                                       class="form-control"
                                       name="cpf"
                                       id="field_cpf"
                                       ui-br-cpf-mask
                                       required
                                       ng-blur="loadByCpfCnpj()"
                                       ng-model="usuario.dadosPessoais.cpfCnpj">

                                <div ng-show="form.cpf.$invalid" class="has-error">
                                    <p class="help-block"
                                       ng-show="form.cpf.$error.cpf">
                                        CPF inválido.
                                    </p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label>Nome <span class="text-danger">*</span></label>
                                <input type="text"
                                       class="form-control"
                                       name="nome"
                                       minlength="3" maxlength="50"
                                       ng-model="usuario.dadosPessoais.nomeRazaoSocial"
                                       required>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-md-6">
                                <label>E-mail <span class="text-danger">*</span></label>
                                <input type="email"
                                       class="form-control"
                                       name="email"
                                       required
                                       ng-model="usuario.dadosPessoais.email"
                                       minlength="5" maxlength="100">

                                <div ng-show="form.email.$invalid" class="has-error">
                                    <p class="help-block"
                                       ng-show="form.email.$error.email">
                                        O E-mail é inválido.
                                    </p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label for="field_telefone">Data de Nascimento <span
                                        class="text-danger">*</span></label>
                                <input type="date"
                                       class="form-control"
                                       name="dataNascimento"
                                       id="field_data_nascimento"
                                       required
                                       ng-model="usuario.dadosPessoais.dataNascimento">
                            </div>
                            <div class="col-md-3">
                                <label for="field_telefone">Telefone <span class="text-danger">*</span></label>
                                <input type="text"
                                       class="form-control"
                                       name="telefone"
                                       id="field_telefone"
                                       required
                                       ui-br-phone-number
                                       ng-model="usuario.dadosPessoais.telefone">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h4>Endereço</h4>
            </div>
            <div class="ibox-content">
                <div class="form-group">
                    <div class="col-md-2">
                        <label for="field_cep">CEP <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               name="cep"
                               id="field_cep"
                               ui-br-cep-mask
                               ng-blur="loadEnderecoByCEP(usuario.dadosPessoais.cep)"
                               ng-model="usuario.dadosPessoais.cep"
                               required>
                    </div>
                    <div class="col-md-3">
                        <label for="field_bairro">Bairro <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               name="bairro"
                               required
                               id="field_bairro"
                               ng-model="usuario.dadosPessoais.bairro"
                               maxlength="255">
                    </div>
                    <div class="col-md-5">
                        <label for="field_logradouro">Logradouro <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               name="logradouro"
                               id="field_logradouro"
                               ng-model="usuario.dadosPessoais.logradouro"
                               maxlength="255"
                               required>
                    </div>
                    <div class="col-md-2">
                        <label for="field_numero">Número <span class="text-danger">*</span></label>
                        <input type="text" class="form-control"
                               name="numero"
                               id="field_numero"
                               ng-model="usuario.dadosPessoais.numero"
                               maxlength="255"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-md-3">
                        <label for="field_complemento">Complemento</label>
                        <input type="text" class="form-control" name="complemento"
                               id="field_complemento"
                               ng-model="usuario.dadosPessoais.complemento" maxlength="255">
                    </div>
                    <div class="col-md-6">
                        <label for="field_bairro">Cidade <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               name="cidade"
                               id="field_cidade"
                               ng-model="usuario.dadosPessoais.municipio"
                               maxlength="255">
                    </div>
                    <div class="col-md-3">
                        <label for="field_uf">UF <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               name="uf"
                               id="field_uf"
                               required
                               ng-model="usuario.dadosPessoais.uf"
                               maxlength="2">
                    </div>
                </div>
            </div>
        </div>

        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h4>Acesso ao Sistema</h4>
            </div>
            <div class="ibox-content">
                <div class="form-group">
                    <div class="col-md-4">
                        <label>Senha <span class="text-danger">*</span></label>
                        <input type="password"
                               class="form-control"
                               name="senha"
                               placeholder="Senha"
                               ng-model="usuario.senha"
                               ng-minlength=5 ng-maxlength=50
                               required>
                        <password-strength-bar password-to-check="usuario.password">
                        </password-strength-bar>
                    </div>
                    <div class="col-md-4">
                        <label>Confirmação de Senha <span class="text-danger">*</span></label>
                        <input type="password"
                               class="form-control"
                               name="confirmarSenha"
                               placeholder="Informe a senha novamente"
                               ng-model="usuario.confirmarSenha"
                               ng-minlength=5 ng-maxlength=50
                               required>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div ng-show="passo == 2">
        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h4>Regulamento</h4>
            </div>
            <div class="ibox-content">
                <div>
                    <div class="col-md-12" style="overflow: auto; max-height: 500px;">
                        <div ng-bind-html="trustAsHtml(termo.conteudo)"></div>
                    </div>
                </div>


                <div class="row" style="padding: 50px 0 10px 0;">
                    <div class="form-group m-t-md">
                        <div class="col-md-4 p-md">
                            <input type="checkbox" ng-model="aceito">
                            <span>Estou de acordo com o termo de uso.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="ibox float-e-margins">
        <div class="ibox-content">
            <div class="row">
                <div class="col-md-10 m-t-sm">
                    <button type="button"
                            class="btn btn-info"
                            ng-click="voltar()">
                        <span class="glyphicon glyphicon-arrow-left"></span><span>Voltar</span>
                    </button>
                </div>
                <div class="col-md-2 m-t-sm">
                    <button type="button"
                            class="btn btn-primary btn-block"
                            ng-click="continuar(form)">
                        <span class="glyphicon glyphicon-arrow-right"></span>
                        <span>{{passo == 2 ? 'Registrar' : 'Continuar'}}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
