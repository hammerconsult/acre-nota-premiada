<div class="tabs-container">
    <div class="tab-content">
        <div role="tabpanel" class="tab-pane active">
            <div class="panel-body text-raleway">
                <div class="col-lg-12 m-t-lg p-lg">
                    <div class="row">
                        <div class="col-lg-12 text-center alert alert-info" ng-show="!sorteios || sorteios.length ==0">
                            Nenhuma apuração foi realizada
                        </div>
                        <div class="col-lg-12">
                            <div class="col-lg-3" ng-repeat="sorteio in sorteios">
                                <div class="widget white-bg  p-lg text-center">
                                    <div class="m-b-md">
                                        <i class="fa fa-calendar fa-4x"></i>
                                        <h1 class="m-xs">{{sorteio.dataSorteio | date: 'dd/MM/yyyy': '+0000'}}</h1>
                                        <h3 class="font-bold no-margins">
                                            {{sorteio.numero}} - {{sorteio.descricao}}
                                        </h3>
                                        <br/>
                                        <a ng-if="sorteio.dataDivulgacaoCupom <= hoje"
                                           ng-click="verBilhetesPremiados(sorteio)">Exibir
                                            bilhetes premiados</a>
                                        <br/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
