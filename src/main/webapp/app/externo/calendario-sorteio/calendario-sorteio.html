<div class="tabs-container">
    <div class="tab-content">
        <div role="tabpanel" class="tab-pane active">
            <div class="panel-body text-raleway">
                <div class="col-lg-12 m-t-lg p-lg">
                    <div class="col-lg-3" ng-repeat="sorteio in sorteios">
                        <div class="widget white-bg  p-lg text-center">
                            <div class="m-b-md">
                                <i class="fa fa-calendar fa-4x"></i>
                                <h1 class="m-xs">{{sorteio.dataSorteio | date: 'dd/MM/yyyy': '+0000'}}</h1>
                                <small>Notas entre {{sorteio.inicioEmissaoNotaFiscal | date: 'dd/MM/yyyy': '+0000' }} e
                                    {{sorteio.fimEmissaoNotaFiscal | date: 'dd/MM/yyyy': '+0000'}}</small><br/>
                                <small>Bilhetes divulgados em
                                    {{sorteio.dataDivulgacaoCupom | date: 'dd/MM/yyyy': '+0000'}}</small>
                                <br/>
                                <a type="submit"
                                   title="Clique para imprimir o documento"
                                   ng-show="sorteio.dataDivulgacaoCupom <= hoje"
                                   ng-click="downloadRelatorioBilhetesSorteio(sorteio.id)"
                                   class="text-primary">
                                    <span class="fa fa-print"></span>
                                    Download
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
